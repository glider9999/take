version: '3.8'

services:
  take-web:
    image: node:20-alpine
    container_name: take-web-client
    working_dir: /app
    volumes:
      - ..:/app
      - take_user_data:/root/.take
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm -r build && pnpm --filter @take/web preview --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  take_user_data:

